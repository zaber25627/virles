<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070b18" />
  <title>Premium Mini App</title>

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind (CDN, no build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: { fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] } } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
</head>
<body>
  <div class="bg-orbs"><span></span><span></span><span></span></div>

  <!-- LOADING SCREEN -->
  <div id="loader">
    <div class="logo-badge" id="loaderLogo">PM</div>
    <div class="text-center">
      <div class="text-xl font-extrabold brand-text" id="loaderName">Premium Mini App</div>
      <div class="text-soft text-xs mt-1">Loading your experience…</div>
    </div>
    <div class="loader-bar"><i></i></div>
  </div>

  <!-- APP SHELL -->
  <div id="app" class="relative z-10 max-w-md mx-auto min-h-screen flex flex-col">
    <!-- Top bar -->
    <header class="sticky top-0 z-30 px-4 pt-3 pb-2">
      <div class="glass rounded-2xl px-3 py-2.5 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl brand-grad grid place-items-center text-white font-extrabold" id="topLogo">PM</div>
        <div class="flex-1 min-w-0">
          <div class="font-bold leading-tight truncate" id="topAppName">Premium Mini App</div>
          <div class="text-[11px] text-soft truncate" id="topHello">Welcome</div>
        </div>
        <button id="btnNotif" class="relative w-10 h-10 rounded-xl chip grid place-items-center">
          🔔
          <span id="notifDot" class="hide absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] grid place-items-center"></span>
        </button>
        <button id="btnTheme" class="w-10 h-10 rounded-xl chip grid place-items-center">🌙</button>
      </div>
      <div id="maintenanceBar" class="hide mt-2 glass-strong rounded-xl px-3 py-2 text-xs text-center status-pending">🛠️ Maintenance mode is on.</div>
      <div id="configBar" class="hide mt-2 glass-strong rounded-xl px-3 py-2 text-xs text-center status-pending">
        ⚙️ Firebase not configured — paste your credentials in <b>firebase-config.js</b>. UI shown in preview mode.
      </div>
    </header>

    <!-- Content -->
    <main id="app-content" class="flex-1 px-4 pb-28 pt-1"></main>

    <!-- Bottom nav -->
    <nav class="bottom-nav fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md px-4 pb-3 z-30">
      <div class="glass-strong rounded-2xl grid grid-cols-5 py-1.5">
        <button data-nav="home" class="flex flex-col items-center gap-1 py-1.5 text-soft text-[11px] font-medium">
          <span class="nav-ic w-9 h-9 rounded-xl grid place-items-center text-base">🏠</span>Home
        </button>
        <button data-nav="tasks" class="flex flex-col items-center gap-1 py-1.5 text-soft text-[11px] font-medium">
          <span class="nav-ic w-9 h-9 rounded-xl grid place-items-center text-base">🎯</span>Tasks
        </button>
        <button data-nav="ads" class="flex flex-col items-center gap-1 py-1.5 text-soft text-[11px] font-medium">
          <span class="nav-ic w-9 h-9 rounded-xl grid place-items-center text-base">📺</span>Earn
        </button>
        <button data-nav="wallet" class="flex flex-col items-center gap-1 py-1.5 text-soft text-[11px] font-medium">
          <span class="nav-ic w-9 h-9 rounded-xl grid place-items-center text-base">💼</span>Wallet
        </button>
        <button data-nav="profile" class="flex flex-col items-center gap-1 py-1.5 text-soft text-[11px] font-medium">
          <span class="nav-ic w-9 h-9 rounded-xl grid place-items-center text-base">👤</span>Profile
        </button>
      </div>
    </nav>
  </div>

  <div id="toasts"></div>

  <script src="firebase-config.js"></script>
  <script src="assets/js/firebase-init.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
